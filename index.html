<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>阿里山漫活二日遊｜互動地圖與導航</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS (改用穩定度更高的 cdnjs) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    }

    /* 強制確保地圖容器擁有明確尺寸 */
    #map {
      width: 100%;
      height: 100%;
      min-height: 250px;
      background-color: #e5e7eb;
    }

    /* GPS 目前位置脈衝動畫 */
    .gps-pulse-wrapper {
      position: relative;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gps-pulse-ring {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: rgba(37, 99, 235, 0.35);
      animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    .gps-dot {
      position: relative;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #2563eb;
      border: 2.5px solid #ffffff;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.35);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.6); opacity: 0.9; }
      80%, 100% { transform: scale(1.9); opacity: 0; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <div id="app-container" class="flex flex-col md:flex-row w-full h-full overflow-hidden">

    <!-- 上半部（手機佔 1/2）：標題 ＋ 天數按鈕 ＋ 可捲動行程卡片 -->
    <section id="top-panel" class="w-full md:w-[440px] lg:w-[480px] flex flex-col bg-white border-b-2 md:border-b-0 md:border-r border-slate-300 z-20 overflow-hidden">

      <!-- 綠色主題頂部 Header -->
      <header class="bg-[#1b5e36] text-white px-3.5 py-2 shrink-0">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <div class="w-8 h-8 rounded-lg bg-[#2e7d4b] flex items-center justify-center shrink-0">
              <i class="fa-solid fa-mountain-sun text-emerald-100 text-sm"></i>
            </div>
            <div class="min-w-0">
              <h1 class="text-sm font-bold tracking-wide truncate">阿里山漫活二日遊</h1>
              <p class="text-[10px] text-emerald-100/90 truncate">11/29 入住阿里山閣大飯店｜高雄出發（無日出版）</p>
            </div>
          </div>
          <!-- GPS 狀態膠囊 -->
          <div class="flex items-center gap-1.5 text-[10px] bg-[#134627] px-2 py-1 rounded-full border border-emerald-600/50 shrink-0">
            <span id="gps-status-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
            <span id="gps-status-text">GPS定位中</span>
          </div>
        </div>
      </header>

      <!-- 天數切換按鈕列 -->
      <div class="grid grid-cols-3 gap-1.5 px-2.5 py-1.5 bg-slate-100 border-b border-slate-200 shrink-0">
        <button onclick="filterDay('all')" id="tab-all"
          class="tab-btn py-1 px-2 rounded-md text-xs font-bold bg-[#1b5e36] text-white shadow-sm flex items-center justify-center gap-1">
          <i class="fa-solid fa-list-ul"></i> 全部行程
        </button>
        <button onclick="filterDay(1)" id="tab-1"
          class="tab-btn py-1 px-2 rounded-md text-xs font-bold bg-white text-slate-700 border border-slate-200 flex items-center justify-center gap-1">
          第一天 (11/29)
        </button>
        <button onclick="filterDay(2)" id="tab-2"
          class="tab-btn py-1 px-2 rounded-md text-xs font-bold bg-white text-slate-700 border border-slate-200 flex items-center justify-center gap-1">
          第二天 (11/30)
        </button>
      </div>

      <!-- 行程卡片捲動區 -->
      <div id="itinerary-list" class="flex-1 overflow-y-auto px-2.5 py-2 space-y-2 bg-slate-50 min-h-0">
        <!-- JS 動態產生 -->
      </div>
    </section>

    <!-- 下半部（手機佔 1/2）：互動地圖區 -->
    <section id="map-panel" class="relative w-full md:flex-1 bg-slate-200 z-10 overflow-hidden">
      <div id="map"></div>

      <!-- 圖資切換按鈕（若遇圖磚載入慢可一鍵切換備援底圖） -->
      <div class="absolute top-3 right-3 z-[1000]">
        <button onclick="switchBaseMap()" id="map-style-btn"
          class="bg-white/95 hover:bg-white text-slate-700 border border-slate-300 shadow px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1">
          <i class="fa-solid fa-layer-group text-[#1b5e36]"></i> <span>切換底圖</span>
        </button>
      </div>

      <!-- 右下角懸浮操作按鈕：定位到我 / 檢視全覽 -->
      <div class="absolute bottom-6 right-3 z-[1000] flex flex-col gap-2">
        <button onclick="centerOnUser()" title="定位到我的目前位置"
          class="bg-white hover:bg-blue-50 text-blue-600 border border-slate-300 shadow-lg w-10 h-10 rounded-full flex items-center justify-center active:scale-95">
          <i class="fa-solid fa-location-crosshairs text-base"></i>
        </button>
        <button onclick="fitAllMarkers()" title="顯示完整行程範圍"
          class="bg-white hover:bg-emerald-50 text-[#1b5e36] border border-slate-300 shadow-lg w-10 h-10 rounded-full flex items-center justify-center active:scale-95">
          <i class="fa-solid fa-expand text-sm"></i>
        </button>
      </div>
    </section>

  </div>

  <!-- 步道圖彈出檢視視窗 (Modal) -->
  <div id="trail-modal" onclick="closeTrailModal()"
    class="fixed inset-0 z-[2000] bg-black/80 hidden flex-col items-center justify-center p-3">
    <div onclick="event.stopPropagation()"
      class="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl border border-slate-200">
      <div class="bg-[#1b5e36] text-white px-4 py-2.5 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <i class="fa-solid fa-map-location-dot text-amber-300"></i>
          <h2 class="text-sm font-bold truncate">阿里山國家森林遊樂區步道導覽圖</h2>
        </div>
        <button onclick="closeTrailModal()"
          class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 text-white flex items-center justify-center transition">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>

      <div class="bg-amber-50 border-b border-amber-200 px-3.5 py-2 text-xs text-amber-900 flex items-start gap-2 shrink-0">
        <i class="fa-solid fa-triangle-exclamation text-amber-600 mt-0.5"></i>
        <span><b>施工提醒：</b>巨木群棧道(1) 於 115.1.19～116.5.31 施工封閉，建議改走<b>巨木群棧道(2)</b> 或經<b>慈雲觀景</b>方向前往香林神木。</span>
      </div>

      <div class="flex-1 overflow-auto bg-slate-1
